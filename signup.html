<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Roy Gadgets</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-blue-300">

    <!-- Main Section -->
    <section class="min-h-screen flex items-center justify-center px-4 py-10">

        <!-- Sign Up Card -->
        <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-6 sm:p-8 md:p-10">

            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold">
                Roy <span class="text-blue-600">Gadgets</span>
                </h1>

                <p class="text-gray-700 mt-2 font-semibold">
                    Create your account
                </p>
            </div>


            <!-- Sign Up Form -->
            <form action="index.html" method="post" class="space-y-5">

                <!-- Full Name -->
                <div class="mb-5">
                    <label for="name"
                        class="block text-gray-700 font-semibold mb-2">
                        Full Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            

                <!-- Email -->
                <div class="mb-5">
                    <label for="email"
                        class="block text-gray-700 font-semibold mb-2">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Phone -->
                <div class="mb-5">
                    <label for="phone"
                        class="block text-gray-700 font-semibold mb-2">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Password -->
                <div class="mb-5">
                    <label for="password"
                        class="block text-gray-700 font-semibold mb-2">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Confirm Password -->
                <div class="mb-7">
                    <label for="confirm-password"
                        class="block text-gray-700 font-semibold mb-2">
                        Confirm Password:
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

              <!-- Create Account Button -->
              <a href="login.html"
               class="block w-full bg-blue-600 text-white py-3.5 rounded-full font-semibold text-lg text-center hover:bg-blue-700 transition">
               Create Account
              </a>
            </form>


            <!-- Login -->
            <p class="text-center text-gray-600 mt-7">
                Already have an account?

                <a href="login.html"
                    class="text-blue-600 font-semibold hover:underline">
                    Login
                </a>
            </p>

    </section>

</body>
</html>
